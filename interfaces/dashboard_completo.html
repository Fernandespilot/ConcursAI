<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard ConcursAI Completo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        
        .navbar {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .navbar h1 {
            color: #ffd700;
            font-size: 1.8em;
        }
        
        .navbar-controls {
            display: flex;
            gap: 15px;
        }
        
        .btn {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(78, 205, 196, 0.3);
        }
        
        .btn.danger {
            background: linear-gradient(45deg, #ff6b6b, #ff8787);
        }
        
        .btn.danger:hover {
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 10px;
        }
        
        .stat-label {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .controls-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .form-group select,
        .form-group input {
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 14px;
        }
        
        .search-section {
            display: flex;
            gap: 15px;
            align-items: end;
            margin-top: 20px;
        }
        
        .search-input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 16px;
        }
        
        .results-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .results-count {
            font-size: 1.2em;
            font-weight: 600;
        }
        
        .concurso-grid {
            display: grid;
            gap: 20px;
        }
        
        .concurso-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 25px;
            border-left: 5px solid #ffd700;
            transition: all 0.3s;
        }
        
        .concurso-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }
        
        .concurso-titulo {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #ffd700;
            line-height: 1.4;
        }
        
        .concurso-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .info-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9em;
            display: flex;
            flex-direction: column;
        }
        
        .info-label {
            font-weight: 600;
            margin-bottom: 5px;
            opacity: 0.8;
            font-size: 0.8em;
            text-transform: uppercase;
        }
        
        .info-value {
            font-weight: 500;
        }
        
        .concurso-badges {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        
        .badge {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: 600;
        }
        
        .badge.urgente {
            background: linear-gradient(45deg, #ff6b6b, #ff8787);
        }
        
        .badge.atencao {
            background: linear-gradient(45deg, #ffa500, #ffb347);
        }
        
        .badge.normal {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
        }
        
        .badge.real {
            background: linear-gradient(45deg, #00c851, #007e33);
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }
        
        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }
        
        .chart-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 20px;
            color: #ffd700;
            text-align: center;
        }
        
        .chart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .chart-item:last-child {
            border-bottom: none;
        }
        
        .chart-label {
            font-weight: 500;
        }
        
        .chart-value {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            padding: 5px 10px;
            border-radius: 10px;
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .navbar {
                padding: 10px 15px;
                flex-direction: column;
                gap: 15px;
            }
            
            .navbar-controls {
                width: 100%;
                justify-content: center;
            }
            
            .controls-grid {
                grid-template-columns: 1fr;
            }
            
            .search-section {
                flex-direction: column;
            }
            
            .concurso-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>🎯 ConcursAI Dashboard Completo</h1>
        <div class="navbar-controls">
            <button class="btn" onclick="carregarEstatisticas()">📊 Atualizar Stats</button>
            <button class="btn" onclick="executarScraper()">🕷️ Executar Scraper</button>
            <button class="btn danger" onclick="exportarDados()">📁 Exportar CSV</button>
            <a href="http://localhost:8008/docs" class="btn" target="_blank">📖 API Docs</a>
        </div>
    </nav>

    <div class="container">
        <!-- Status do Sistema -->
        <div class="status-bar" id="statusBar">
            <strong>Status:</strong> Carregando sistema...
        </div>

        <!-- Estatísticas -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-value" id="totalConcursos">-</div>
                <div class="stat-label">Total de Concursos</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="concursosUrgentes">-</div>
                <div class="stat-label">Urgentes</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="novosConcursos">-</div>
                <div class="stat-label">Novos Hoje</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="fontesAtivas">-</div>
                <div class="stat-label">Fontes Ativas</div>
            </div>
        </div>

        <!-- Gráficos e Análises -->
        <div class="charts-section">
            <div class="chart-card">
                <div class="chart-title">📍 Concursos por Região</div>
                <div id="chartRegioes"></div>
            </div>
            
            <div class="chart-card">
                <div class="chart-title">🎓 Por Escolaridade</div>
                <div id="chartEscolaridade"></div>
            </div>
            
            <div class="chart-card">
                <div class="chart-title">⚡ Por Urgência</div>
                <div id="chartUrgencia"></div>
            </div>
            
            <div class="chart-card">
                <div class="chart-title">🏢 Top Órgãos</div>
                <div id="chartOrgaos"></div>
            </div>
        </div>

        <!-- Controles de Filtro -->
        <div class="controls-section">
            <h3>🔍 Filtros Avançados</h3>
            
            <div class="controls-grid">
                <div class="form-group">
                    <label>Região:</label>
                    <select id="filtroRegiao">
                        <option value="">Todas as regiões</option>
                        <option value="Norte">Norte</option>
                        <option value="Nordeste">Nordeste</option>
                        <option value="Centro-Oeste">Centro-Oeste</option>
                        <option value="Sudeste">Sudeste</option>
                        <option value="Sul">Sul</option>
                        <option value="Nacional">Nacional</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Estado:</label>
                    <select id="filtroEstado">
                        <option value="">Todos os estados</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Escolaridade:</label>
                    <select id="filtroEscolaridade">
                        <option value="">Todas</option>
                        <option value="Ensino Fundamental">Ensino Fundamental</option>
                        <option value="Ensino Médio">Ensino Médio</option>
                        <option value="Ensino Superior">Ensino Superior</option>
                        <option value="Pós-graduação">Pós-graduação</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Urgência:</label>
                    <select id="filtroUrgencia">
                        <option value="">Todas</option>
                        <option value="urgente">Urgente (≤ 7 dias)</option>
                        <option value="atenção">Atenção (≤ 30 dias)</option>
                        <option value="normal">Normal (> 30 dias)</option>
                    </select>
                </div>
            </div>
            
            <div class="search-section">
                <input type="text" class="search-input" id="searchInput" placeholder="Buscar por título, órgão, cargo...">
                <button class="btn" onclick="buscarConcursos()">🔍 Buscar</button>
                <button class="btn" onclick="limparFiltros()">🗑️ Limpar</button>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Carregando dados...</p>
        </div>

        <!-- Resultados -->
        <div class="results-section">
            <div class="results-header">
                <div class="results-count" id="resultsCount">Carregando concursos...</div>
                <div>
                    <button class="btn" onclick="alternarVisualizacao()">🔄 Alterar Vista</button>
                </div>
            </div>
            
            <div class="concurso-grid" id="concursoGrid"></div>
        </div>
    </div>

    <script>
        let todosOsConcursos = [];
        let concursosFiltrados = [];
        let estatisticas = {};
        
        // Inicialização
        window.addEventListener('load', async function() {
            await carregarEstatisticas();
            await carregarConcursos();
            verificarStatus();
        });
        
        async function carregarEstatisticas() {
            try {
                const response = await fetch('http://localhost:8008/estatisticas');
                const data = await response.json();
                estatisticas = data.estatisticas;
                
                // Atualizar estatísticas na tela
                document.getElementById('totalConcursos').textContent = estatisticas.total_concursos || 0;
                document.getElementById('concursosUrgentes').textContent = estatisticas.por_urgencia?.urgente || 0;
                document.getElementById('novosConcursos').textContent = '12'; // Simulado
                document.getElementById('fontesAtivas').textContent = '5'; // Simulado
                
                // Atualizar gráficos
                atualizarGraficos();
                
            } catch (error) {
                console.error('Erro ao carregar estatísticas:', error);
                updateStatus('❌ Erro ao carregar estatísticas');
            }
        }
        
        async function carregarConcursos() {
            showLoading(true);
            updateStatus('Carregando concursos...');
            
            try {
                const response = await fetch('http://localhost:8008/concursos?limit=100');
                const data = await response.json();
                
                todosOsConcursos = data.concursos || [];
                concursosFiltrados = [...todosOsConcursos];
                
                displayConcursos(concursosFiltrados);
                updateStatus(`✅ ${todosOsConcursos.length} concursos carregados`);
                
            } catch (error) {
                console.error('Erro ao carregar concursos:', error);
                updateStatus('❌ Erro ao carregar concursos');
                document.getElementById('concursoGrid').innerHTML = '<p>Erro ao carregar dados. Verifique a conexão.</p>';
            } finally {
                showLoading(false);
            }
        }
        
        async function buscarConcursos() {
            showLoading(true);
            
            const filtros = {
                texto: document.getElementById('searchInput').value.trim(),
                regiao: document.getElementById('filtroRegiao').value,
                estado: document.getElementById('filtroEstado').value,
                escolaridade: document.getElementById('filtroEscolaridade').value,
                urgencia: document.getElementById('filtroUrgencia').value,
                limit: 100
            };
            
            // Remover filtros vazios
            Object.keys(filtros).forEach(key => {
                if (filtros[key] === '' || filtros[key] === null) {
                    delete filtros[key];
                }
            });
            
            try {
                const response = await fetch('http://localhost:8008/buscar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(filtros)
                });
                
                const data = await response.json();
                concursosFiltrados = data.concursos || [];
                
                displayConcursos(concursosFiltrados);
                updateStatus(`🔍 ${concursosFiltrados.length} concursos encontrados`);
                
            } catch (error) {
                console.error('Erro na busca:', error);
                updateStatus('❌ Erro na busca');
            } finally {
                showLoading(false);
            }
        }
        
        function displayConcursos(concursos) {
            const grid = document.getElementById('concursoGrid');
            const count = document.getElementById('resultsCount');
            
            count.textContent = `${concursos.length} concursos encontrados`;
            
            if (concursos.length === 0) {
                grid.innerHTML = '<p style="text-align: center; padding: 40px; opacity: 0.7;">Nenhum concurso encontrado com os filtros aplicados.</p>';
                return;
            }
            
            const html = concursos.map(concurso => `
                <div class="concurso-card">
                    <div class="concurso-titulo">${concurso.titulo}</div>
                    
                    <div class="concurso-info">
                        <div class="info-item">
                            <div class="info-label">Órgão</div>
                            <div class="info-value">${concurso.orgao}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Cargo</div>
                            <div class="info-value">${concurso.cargo}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Local</div>
                            <div class="info-value">${concurso.local} - ${concurso.regiao}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Escolaridade</div>
                            <div class="info-value">${concurso.escolaridade}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Vagas</div>
                            <div class="info-value">${concurso.vagas}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Salário</div>
                            <div class="info-value">${concurso.salario}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Status</div>
                            <div class="info-value">${concurso.status}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Prazo</div>
                            <div class="info-value">${concurso.prazo_inscricoes}</div>
                        </div>
                    </div>
                    
                    <div class="concurso-badges">
                        <span class="badge ${concurso.urgencia}">${concurso.urgencia.toUpperCase()}</span>
                        ${concurso.fonte && concurso.fonte.includes('Real') ? 
                            '<span class="badge real">DADOS REAIS</span>' : 
                            '<span class="badge normal">EXEMPLO</span>'
                        }
                        ${concurso.url ? 
                            `<a href="${concurso.url}" target="_blank" style="color: #ffd700; text-decoration: none;">🔗 Ver Original</a>` : 
                            ''
                        }
                    </div>
                </div>
            `).join('');
            
            grid.innerHTML = html;
        }
        
        function atualizarGraficos() {
            // Gráfico por região
            if (estatisticas.por_regiao) {
                const regiaoHtml = Object.entries(estatisticas.por_regiao)
                    .sort(([,a], [,b]) => b - a)
                    .map(([regiao, count]) => `
                        <div class="chart-item">
                            <div class="chart-label">${regiao}</div>
                            <div class="chart-value">${count}</div>
                        </div>
                    `).join('');
                document.getElementById('chartRegioes').innerHTML = regiaoHtml;
            }
            
            // Gráfico por escolaridade
            if (estatisticas.por_escolaridade) {
                const escolaridadeHtml = Object.entries(estatisticas.por_escolaridade)
                    .sort(([,a], [,b]) => b - a)
                    .map(([escolaridade, count]) => `
                        <div class="chart-item">
                            <div class="chart-label">${escolaridade}</div>
                            <div class="chart-value">${count}</div>
                        </div>
                    `).join('');
                document.getElementById('chartEscolaridade').innerHTML = escolaridadeHtml;
            }
            
            // Gráfico por urgência
            if (estatisticas.por_urgencia) {
                const urgenciaHtml = Object.entries(estatisticas.por_urgencia)
                    .sort(([,a], [,b]) => b - a)
                    .map(([urgencia, count]) => `
                        <div class="chart-item">
                            <div class="chart-label">${urgencia.toUpperCase()}</div>
                            <div class="chart-value">${count}</div>
                        </div>
                    `).join('');
                document.getElementById('chartUrgencia').innerHTML = urgenciaHtml;
            }
            
            // Top órgãos
            if (estatisticas.orgaos_top) {
                const orgaosHtml = Object.entries(estatisticas.orgaos_top)
                    .slice(0, 8)
                    .map(([orgao, count]) => `
                        <div class="chart-item">
                            <div class="chart-label">${orgao}</div>
                            <div class="chart-value">${count}</div>
                        </div>
                    `).join('');
                document.getElementById('chartOrgaos').innerHTML = orgaosHtml;
            }
        }
        
        async function executarScraper() {
            updateStatus('🕷️ Executando scraper...');
            showLoading(true);
            
            try {
                const response = await fetch('http://localhost:8008/scraper/executar', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.sucesso) {
                    updateStatus(`✅ Scraper concluído: ${data.total_coletados} concursos coletados`);
                    await carregarEstatisticas();
                    await carregarConcursos();
                } else {
                    updateStatus(`❌ Erro no scraper: ${data.erro}`);
                }
                
            } catch (error) {
                console.error('Erro ao executar scraper:', error);
                updateStatus('❌ Erro ao executar scraper');
            } finally {
                showLoading(false);
            }
        }
        
        async function exportarDados() {
            updateStatus('📁 Exportando dados...');
            
            try {
                const response = await fetch('http://localhost:8008/export/csv');
                
                if (response.ok) {
                    // Criar link de download
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `concursos_${new Date().toISOString().split('T')[0]}.csv`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    
                    updateStatus('✅ Dados exportados com sucesso');
                } else {
                    updateStatus('❌ Erro ao exportar dados');
                }
                
            } catch (error) {
                console.error('Erro na exportação:', error);
                updateStatus('❌ Erro na exportação');
            }
        }
        
        async function verificarStatus() {
            try {
                const response = await fetch('http://localhost:8008/status');
                const data = await response.json();
                
                let statusText = `✅ Sistema online - ${data.total_concursos} concursos`;
                
                if (data.ultimo_scraping) {
                    const ultimoScraping = new Date(data.ultimo_scraping.data).toLocaleString();
                    statusText += ` | Último scraping: ${ultimoScraping}`;
                }
                
                updateStatus(statusText);
                
            } catch (error) {
                updateStatus('❌ Sistema offline');
            }
        }
        
        function limparFiltros() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filtroRegiao').value = '';
            document.getElementById('filtroEstado').value = '';
            document.getElementById('filtroEscolaridade').value = '';
            document.getElementById('filtroUrgencia').value = '';
            
            concursosFiltrados = [...todosOsConcursos];
            displayConcursos(concursosFiltrados);
            updateStatus('🗑️ Filtros limpos');
        }
        
        function alternarVisualizacao() {
            // Funcionalidade para alterar entre visualizações (lista/grid)
            updateStatus('🔄 Funcionalidade em desenvolvimento');
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
        
        function updateStatus(message) {
            document.getElementById('statusBar').innerHTML = `<strong>Status:</strong> ${message}`;
        }
        
        // Busca em tempo real
        document.getElementById('searchInput').addEventListener('input', function(e) {
            if (e.target.value.length === 0 || e.target.value.length >= 3) {
                setTimeout(buscarConcursos, 300);
            }
        });
        
        // Enter para buscar
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarConcursos();
            }
        });
        
        // Atualizar status a cada 30 segundos
        setInterval(verificarStatus, 30000);
    </script>
</body>
</html>
