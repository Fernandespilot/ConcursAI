<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat IA — ConcursAI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="/static/css/concursai.css" rel="stylesheet">
<style>
.chat-layout{display:flex;height:calc(100vh - 48px);overflow:hidden}
.chat-cfg{width:220px;min-width:220px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column}
.cfg-head{padding:11px 14px;border-bottom:1px solid var(--border);font-size:.79rem;font-weight:600;color:var(--text-2)}
.cfg-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1}
.chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chat-topbar{padding:9px 18px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.msgs{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--text-3);gap:8px;padding:40px}
.sug-btn{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:4px 11px;font-size:.73rem;cursor:pointer;color:var(--text-2);font-family:inherit;transition:all .1s}
.sug-btn:hover{border-color:var(--primary);color:var(--primary)}
.input-wrap{padding:11px 18px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
.input-box{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;transition:border-color .1s,box-shadow .1s}
.input-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.input-box textarea{flex:1;border:none;outline:none;font-size:.82rem;font-family:inherit;resize:none;min-height:20px;max-height:100px;line-height:1.6;background:transparent;color:var(--text)}
.send-btn{background:var(--primary);color:#fff;border:none;border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.send-btn:hover{background:var(--primary-hover)}
.send-btn:disabled{background:var(--border);cursor:not-allowed}
.msg-bubble code{background:rgba(0,0,0,.07);padding:1px 5px;border-radius:3px;font-family:'Courier New',monospace;font-size:.85em}
.chat-msg.user .msg-bubble code{background:rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="chat-layout">
  <div class="chat-cfg">
    <div class="cfg-head"><i class="fas fa-sliders-h" style="margin-right:6px;color:var(--primary)"></i>Configurações</div>
    <div class="cfg-body">
      <div class="form-group">
        <label class="form-label">Provedor</label>
        <select class="form-control" id="prov" onchange="onProvChange()">
          <option value="backend">Backend (Groq)</option>
          <option value="openai">OpenAI</option>
          <option value="ollama">Ollama</option>
        </select>
      </div>
      <div class="form-group" id="key-wrap" style="display:none">
        <label class="form-label">API Key</label>
        <input type="password" class="form-control" id="api-key" placeholder="sk-...">
      </div>
      <div class="form-group">
        <label class="form-label">Modo</label>
        <select class="form-control" id="mode">
          <option value="rag">RAG (base de dados)</option>
          <option value="direto">Direto</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Temperatura — <span id="temp-val">0.7</span></label>
        <input type="range" id="temp" min="0" max="1" step="0.1" value="0.7" style="width:100%;accent-color:var(--primary)" oninput="G('temp-val').textContent=this.value">
      </div>
      <button class="btn btn-secondary btn-sm" style="width:100%;margin-top:auto" onclick="clearChat()"><i class="fas fa-rotate-left"></i> Nova conversa</button>
      <div style="padding-top:10px;border-top:1px solid var(--border);font-size:.71rem;color:var(--text-3);line-height:1.7">
        <strong style="color:var(--text-2);display:block;margin-bottom:2px">Pipeline RAG</strong>
        ChromaDB → SentenceTransformers → Groq llama-3.3-70b
      </div>
    </div>
  </div>

  <div class="chat-main">
    <div class="chat-topbar">
      <span style="font-size:.82rem;font-weight:600;color:var(--text)"><i class="fas fa-comments" style="color:var(--primary);margin-right:6px"></i>Chat IA</span>
      <span id="msg-count" style="font-size:.71rem;color:var(--text-3)">0 mensagens</span>
    </div>

    <div class="msgs" id="msgs">
      <div class="chat-empty" id="empty">
        <div style="font-size:1.6rem;opacity:.18"><i class="fas fa-comments"></i></div>
        <div style="font-size:.87rem;font-weight:600;color:var(--text-2)">Como posso ajudar?</div>
        <div style="font-size:.77rem;color:var(--text-3);max-width:260px;line-height:1.7">Pergunte sobre concursos, editais, bancas ou conteúdo de provas.</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:6px">
          <button class="sug-btn" onclick="suggest(this)">Concursos abertos em TI</button>
          <button class="sug-btn" onclick="suggest(this)">Estilo de prova da CEBRASPE</button>
          <button class="sug-btn" onclick="suggest(this)">Diferença entre lei e decreto</button>
          <button class="sug-btn" onclick="suggest(this)">Concursos federais 2024</button>
        </div>
      </div>
    </div>

    <div class="input-wrap">
      <div class="input-box">
        <textarea id="ci" placeholder="Sua pergunta... (Enter para enviar)" rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
          oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px';G('cc').textContent=this.value.length"></textarea>
        <button class="send-btn" id="sbtn" onclick="send()"><i class="fas fa-paper-plane" style="font-size:.7rem"></i></button>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:3px;font-size:.69rem;color:var(--text-3)">
        <span>Shift+Enter = nova linha</span><span id="cc">0</span>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/static/js/layout.js"></script>
<script>
const API='http://localhost:8000';
let n=0;
function G(id){return document.getElementById(id);}
function fmt(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\n/g,'<br>');
}
function addMsg(role,html){
  const el=G('empty');if(el)el.style.display='none';
  n++;G('msg-count').textContent=n+' mensagem'+(n>1?'s':'');
  const d=document.createElement('div');
  d.className='chat-msg'+(role==='user'?' user':'');
  d.innerHTML=`<div class="msg-avatar ${role==='user'?'user':'ai'}">${role==='user'?'<i class="fas fa-user" style="font-size:.58rem"></i>':'AI'}</div><div class="msg-bubble">${html}</div>`;
  G('msgs').appendChild(d);
  G('msgs').scrollTop=G('msgs').scrollHeight;
  return d.querySelector('.msg-bubble');
}
async function send(){
  const ci=G('ci'),q=ci.value.trim();if(!q)return;
  ci.value='';ci.style.height='auto';G('cc').textContent=0;G('sbtn').disabled=true;
  addMsg('user',fmt(q));
  const bubble=addMsg('ai','<span style="color:var(--text-3);font-style:italic"><i class="fas fa-circle-notch fa-spin" style="font-size:.72rem;margin-right:4px"></i>Pensando...</span>');
  try{
    const body={pergunta:q,query:q,temperatura:parseFloat(G('temp').value),modo:G('mode').value};
    if(G('prov').value!=='backend')body.api_key=G('api-key').value;
    const d=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
    bubble.innerHTML=fmt(d.resposta||d.response||d.answer||d.message||JSON.stringify(d));
  }catch(e){bubble.innerHTML=`<span style="color:var(--danger)"><i class="fas fa-exclamation-circle"></i> ${e.message}</span>`;}
  G('sbtn').disabled=false;G('msgs').scrollTop=G('msgs').scrollHeight;
}
function suggest(b){G('ci').value=b.textContent;send();}
function clearChat(){n=0;G('msgs').innerHTML='';G('msg-count').textContent='0 mensagens';location.reload();}
function onProvChange(){G('key-wrap').style.display=G('prov').value==='openai'?'block':'none';}

const qp=new URLSearchParams(location.search).get('q');
if(qp){G('ci').value=qp;setTimeout(send,400);}

initLayout({active:'chat',title:'Chat IA'});
</script>
</body></html>
