<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Concursos — ConcursAI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="/static/css/concursai.css" rel="stylesheet">
<style>
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-bar input{flex:1}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters select{font-size:.78rem}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.c-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;cursor:pointer;transition:border-color .12s}
.c-card:hover{border-color:var(--primary)}
.c-title{font-size:.84rem;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.4}
.c-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.c-desc{font-size:.76rem;color:var(--text-3);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);width:90%;max-width:520px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:18px;font-size:.82rem;color:var(--text-2);line-height:1.8}
.modal-body strong{color:var(--text)}
</style>
</head>
<body>
<div class="page-header">
  <div class="page-title"><i class="fas fa-search"></i>Busca de Concursos</div>
  <div class="page-subtitle">Busca semântica por RAG na base de concursos coletados</div>
</div>
<div class="page-body">
  <div class="search-bar">
    <input type="text" class="form-control" id="qb" placeholder="Ex: concursos de TI no governo federal...">
    <button class="btn btn-primary" onclick="buscar()"><i class="fas fa-search"></i> Buscar</button>
  </div>
  <div class="filters">
    <select class="form-control" id="f-area" style="width:auto">
      <option value="">Todas as áreas</option>
      <option value="federal">Federal</option>
      <option value="estadual">Estadual</option>
      <option value="municipal">Municipal</option>
      <option value="tribunal">Tribunal</option>
      <option value="policia">Polícia</option>
    </select>
    <select class="form-control" id="f-status" style="width:auto">
      <option value="">Todos os status</option>
      <option value="Aberto">Inscrições abertas</option>
      <option value="Previsto">Previsto</option>
      <option value="Encerrado">Encerrado</option>
    </select>
    <select class="form-control" id="f-limit" style="width:auto">
      <option value="10">10 resultados</option>
      <option value="20" selected>20 resultados</option>
      <option value="50">50 resultados</option>
    </select>
    <button class="btn btn-secondary btn-sm" onclick="limpar()"><i class="fas fa-times"></i> Limpar</button>
  </div>
  <div id="info" style="font-size:.77rem;color:var(--text-3);margin-bottom:10px"></div>
  <div class="results-grid" id="grid"></div>
  <div id="empty-msg" style="display:none;text-align:center;padding:40px;color:var(--text-3)">
    <i class="fas fa-search" style="font-size:1.8rem;opacity:.2;display:block;margin-bottom:10px"></i>
    Nenhum resultado encontrado. Tente outros termos.
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <span id="m-title" style="font-weight:600;font-size:.88rem"></span>
      <button class="btn btn-secondary btn-xs" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="m-body"></div>
  </div>
</div>

<footer class="footer"><div class="footer-inner">
  <div class="footer-brand"><i class="fas fa-graduation-cap"></i> ConcursAI</div>
  <div class="footer-info">Trabalho de Conclusão de Curso · 2024</div>
  <div class="footer-links"><a href="http://localhost:8000/docs" target="_blank">API Docs</a></div>
</div></footer>
<div class="toast" id="toast"></div>
<script src="/static/js/layout.js"></script>
<script>
const API='http://localhost:8000';
function G(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m,ok=true){const t=G('toast');t.textContent=m;t.className='toast show '+(ok?'success':'error');setTimeout(()=>t.className='toast',2500);}
let data=[];

function renderCard(c,i){
  const status=c.status||'—';
  const sc={'Aberto':'badge-green','Previsto':'badge-blue','Encerrado':'badge-gray'};
  return `<div class="c-card" onclick="openModal(${i})">
    <div class="c-title">${esc(c.cargo||c.titulo||c.orgao||'Concurso')}</div>
    <div class="c-meta">
      <span class="badge ${sc[status]||'badge-gray'}">${esc(status)}</span>
      ${c.banca?`<span class="badge badge-blue">${esc(c.banca)}</span>`:''}
      ${c.area?`<span class="badge badge-gray">${esc(c.area)}</span>`:''}
    </div>
    <div class="c-desc">${esc(c.descricao||c.conteudo||'')}</div>
    <div class="c-footer">
      <span style="font-size:.73rem;color:var(--text-3)">${c.vagas?'<i class="fas fa-users" style="margin-right:3px"></i>'+esc(String(c.vagas))+' vagas':''}</span>
      <button class="btn btn-secondary btn-xs" onclick="event.stopPropagation();verChat(${i})"><i class="fas fa-comments"></i> Perguntar</button>
    </div>
  </div>`;
}

function openModal(i){
  const c=data[i];
  G('m-title').textContent=c.cargo||c.titulo||c.orgao||'Detalhes';
  const rows=[['Órgão',c.orgao],['Banca',c.banca],['Vagas',c.vagas],['Salário',c.salario||c.remuneracao],['Status',c.status],['Área',c.area],['Edital',c.edital],['Data',c.data_publicacao||c.data]].filter(([,v])=>v);
  G('m-body').innerHTML=rows.map(([k,v])=>`<div style="display:flex;gap:8px;margin-bottom:8px"><strong style="min-width:70px;color:var(--text-3)">${esc(k)}</strong><span>${esc(String(v))}</span></div>`).join('')
    +(c.descricao?`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);color:var(--text-2);font-size:.8rem;line-height:1.7">${esc(c.descricao)}</div>`:'');
  G('overlay').classList.add('open');
}
function closeModal(){G('overlay').classList.remove('open');}
function verChat(i){const c=data[i];location.href='/pages/chat?q='+encodeURIComponent('Me fale sobre: '+(c.cargo||c.titulo||c.orgao||'este concurso'));}

async function buscar(){
  const q=G('qb').value.trim(),area=G('f-area').value,status=G('f-status').value,limit=parseInt(G('f-limit').value);
  G('grid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:32px;color:var(--text-3)"><i class="fas fa-circle-notch fa-spin"></i> Buscando...</div>';
  G('empty-msg').style.display='none';
  try{
    const body={query:q||'concursos públicos',n_resultados:limit};
    if(area)body.area=area;if(status)body.status=status;
    const d=await fetch(API+'/buscar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
    data=d.resultados||d.concursos||d||[];
    if(Array.isArray(data)&&data.length){
      G('info').textContent=data.length+' resultado'+(data.length>1?'s':'')+' encontrado'+(data.length>1?'s':'');
      G('grid').innerHTML=data.map(renderCard).join('');
    } else {
      data=[];G('grid').innerHTML='';G('empty-msg').style.display='block';G('info').textContent='';
    }
  }catch(e){G('grid').innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:24px;color:var(--danger);font-size:.82rem"><i class="fas fa-exclamation-circle"></i> Erro ao buscar: ${esc(e.message)}</div>`;}
}

function limpar(){G('qb').value='';G('f-area').value='';G('f-status').value='';buscar();}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
G('qb').addEventListener('keydown',e=>{if(e.key==='Enter')buscar();});

const qp=new URLSearchParams(location.search).get('q');
if(qp)G('qb').value=qp;

initLayout({active:'concursos',title:'Concursos'});
buscar();
</script>
</body></html>
