<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Edital — ConcursAI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="/static/css/concursai.css" rel="stylesheet">
<style>
.edital-layout{display:flex;gap:16px}
.edital-left{width:280px;min-width:280px;display:flex;flex-direction:column;gap:14px}
.edital-right{flex:1;display:flex;flex-direction:column;gap:0}
.upload-area{border:1.5px dashed var(--border);border-radius:var(--radius);padding:28px 20px;text-align:center;cursor:pointer;transition:border-color .12s,background .12s;position:relative}
.upload-area:hover,.upload-area.drag{border-color:var(--primary);background:var(--primary-light)}
.upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-icon{font-size:1.5rem;color:var(--text-3);margin-bottom:8px}
.upload-title{font-size:.82rem;font-weight:600;color:var(--text-2);margin-bottom:2px}
.upload-sub{font-size:.72rem;color:var(--text-3)}
.edital-info{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-size:.77rem;color:var(--text-2);display:none}
.edital-info.show{display:block}
.chat-area{flex:1;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;min-height:400px}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.chat-empty-small{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;color:var(--text-3);padding:24px;gap:6px;font-size:.8rem}
.msg-u{display:flex;justify-content:flex-end;margin-bottom:2px}
.msg-u span{background:var(--primary);color:#fff;border-radius:10px 10px 2px 10px;padding:8px 12px;font-size:.81rem;line-height:1.6;max-width:80%}
.msg-a{display:flex;justify-content:flex-start;margin-bottom:2px}
.msg-a span{background:var(--bg);border:1px solid var(--border);border-radius:2px 10px 10px 10px;padding:8px 12px;font-size:.81rem;line-height:1.6;max-width:85%;color:var(--text-2)}
.chat-input{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:var(--surface)}
.chat-input input{flex:1;border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;font-size:.8rem;font-family:inherit;outline:none}
.chat-input input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
</style>
</head>
<body>
<div class="page-header">
  <div class="page-title"><i class="fas fa-file-pdf"></i>Análise de Edital</div>
  <div class="page-subtitle">Envie um edital em PDF e converse com a IA sobre o conteúdo</div>
</div>
<div class="page-body">
  <div class="edital-layout">
    <!-- Esquerda: upload + info -->
    <div class="edital-left">
      <div class="card">
        <div class="card-header"><div class="card-title"><i class="fas fa-upload"></i>Enviar Edital</div></div>
        <div class="card-body" style="display:flex;flex-direction:column;gap:10px">
          <div class="upload-area" id="drop-zone">
            <input type="file" id="file-input" accept=".pdf" onchange="onFile(this.files[0])">
            <div class="upload-icon"><i class="fas fa-file-pdf"></i></div>
            <div class="upload-title">Arraste o PDF aqui</div>
            <div class="upload-sub">ou clique para selecionar</div>
          </div>
          <div class="edital-info" id="file-info"></div>
          <button class="btn btn-primary" id="upload-btn" style="display:none" onclick="enviarPDF()">
            <i class="fas fa-upload"></i> Processar edital
          </button>
          <div id="upload-r" style="font-size:.78rem;color:var(--text-3)"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title"><i class="fas fa-lightbulb"></i>Sugestões</div></div>
        <div class="card-body" style="display:flex;flex-direction:column;gap:6px">
          <button class="btn btn-secondary btn-sm" style="justify-content:flex-start;text-align:left" onclick="ask('Quais são os requisitos para o cargo?')"><i class="fas fa-chevron-right"></i> Requisitos do cargo</button>
          <button class="btn btn-secondary btn-sm" style="justify-content:flex-start;text-align:left" onclick="ask('Qual é o conteúdo programático?')"><i class="fas fa-chevron-right"></i> Conteúdo programático</button>
          <button class="btn btn-secondary btn-sm" style="justify-content:flex-start;text-align:left" onclick="ask('Qual é o salário e benefícios?')"><i class="fas fa-chevron-right"></i> Salário e benefícios</button>
          <button class="btn btn-secondary btn-sm" style="justify-content:flex-start;text-align:left" onclick="ask('Quais são as datas do concurso?')"><i class="fas fa-chevron-right"></i> Datas importantes</button>
          <button class="btn btn-secondary btn-sm" style="justify-content:flex-start;text-align:left" onclick="ask('Gere um resumo executivo do edital')"><i class="fas fa-chevron-right"></i> Resumo do edital</button>
        </div>
      </div>
    </div>

    <!-- Direita: chat -->
    <div class="edital-right">
      <div class="chat-area">
        <div class="chat-msgs" id="chat-msgs">
          <div class="chat-empty-small" id="chat-empty">
            <i class="fas fa-file-pdf" style="font-size:1.6rem;opacity:.15"></i>
            <span style="font-weight:600;color:var(--text-2)">Envie um edital para começar</span>
            <span>Após processar o PDF, faça perguntas sobre o conteúdo.</span>
          </div>
        </div>
        <div class="chat-input">
          <input type="text" id="qi" placeholder="Pergunta sobre o edital..." onkeydown="if(event.key==='Enter')ask()">
          <button class="btn btn-primary btn-sm" onclick="ask()"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>
<footer class="footer"><div class="footer-inner">
  <div class="footer-brand"><i class="fas fa-graduation-cap"></i> ConcursAI</div>
  <div class="footer-info">Trabalho de Conclusão de Curso · 2024</div>
  <div class="footer-links"><a href="http://localhost:8000/docs" target="_blank">API Docs</a></div>
</div></footer>
<div class="toast" id="toast"></div>
<script src="/static/js/layout.js"></script>
<script>
const API='http://localhost:8000';
let currentFile=null,pdfLoaded=false;
function G(id){return document.getElementById(id);}
function toast(m,ok=true){const t=G('toast');t.textContent=m;t.className='toast show '+(ok?'success':'error');setTimeout(()=>t.className='toast',2500);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(t){return esc(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');}

function onFile(file){
  if(!file)return;
  if(!file.name.endsWith('.pdf')){toast('Apenas arquivos PDF são aceitos',false);return;}
  currentFile=file;
  G('file-info').innerHTML=`<i class="fas fa-file-pdf" style="color:#dc2626;margin-right:5px"></i><strong>${esc(file.name)}</strong><br><span style="color:var(--text-3)">${(file.size/1024/1024).toFixed(2)} MB</span>`;
  G('file-info').classList.add('show');
  G('upload-btn').style.display='block';
}

async function enviarPDF(){
  if(!currentFile){toast('Selecione um PDF',false);return;}
  G('upload-r').innerHTML='<i class="fas fa-circle-notch fa-spin" style="margin-right:5px;color:var(--primary)"></i>Processando...';
  G('upload-btn').disabled=true;
  try{
    const form=new FormData();form.append('file',currentFile);
    const d=await fetch(API+'/edital/upload',{method:'POST',body:form}).then(r=>r.json());
    pdfLoaded=true;
    G('upload-r').innerHTML='<span style="color:var(--accent)"><i class="fas fa-check"></i> '+esc(d.mensagem||d.message||'Processado com sucesso!')+'</span>';
    addMsg('a','Edital processado! Agora você pode fazer perguntas sobre o conteúdo.');
    toast('Edital processado!');
  }catch(e){
    G('upload-r').innerHTML='<span style="color:var(--danger)">'+esc(e.message)+'</span>';
    toast(e.message,false);
  }
  G('upload-btn').disabled=false;
}

function addMsg(role,html){
  G('chat-empty')?.remove();
  const d=document.createElement('div');
  d.className=role==='u'?'msg-u':'msg-a';
  d.innerHTML=`<span>${html}</span>`;
  G('chat-msgs').appendChild(d);
  G('chat-msgs').scrollTop=G('chat-msgs').scrollHeight;
}

async function ask(q){
  const qi=G('qi');
  const pergunta=q||qi.value.trim();
  if(!pergunta)return;
  if(!pdfLoaded){toast('Processe um edital primeiro',false);return;}
  qi.value='';
  addMsg('u',esc(pergunta));
  const thinking=document.createElement('div');
  thinking.className='msg-a';
  thinking.innerHTML='<span style="color:var(--text-3);font-style:italic"><i class="fas fa-circle-notch fa-spin" style="font-size:.72rem;margin-right:4px"></i>Analisando edital...</span>';
  G('chat-msgs').appendChild(thinking);G('chat-msgs').scrollTop=G('chat-msgs').scrollHeight;
  try{
    const d=await fetch(API+'/edital/perguntar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pergunta,query:pergunta})}).then(r=>r.json());
    thinking.querySelector('span').innerHTML=fmt(d.resposta||d.response||d.answer||JSON.stringify(d));
  }catch(e){thinking.querySelector('span').innerHTML=`<span style="color:var(--danger)">${esc(e.message)}</span>`;}
  G('chat-msgs').scrollTop=G('chat-msgs').scrollHeight;
}

// Drag & drop
const dz=G('drop-zone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)onFile(f);});

initLayout({active:'edital',title:'Edital'});
</script>
</body></html>
