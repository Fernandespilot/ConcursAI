<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConcursAI - Chat Provas & Gabaritos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .header p {
            color: #666;
        }
        
        .chat-box {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            height: 600px;
            display: flex;
            flex-direction: column;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .message {
            margin-bottom: 20px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            text-align: right;
        }
        
        .message-content {
            display: inline-block;
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .message.bot .message-content {
            background: #f0f2f5;
            color: #333;
            text-align: left;
        }
        
        .prova-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            margin: 10px 0;
            transition: all 0.3s ease;
        }
        
        .prova-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }
        
        .prova-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .prova-banca {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .prova-ano {
            color: #666;
            font-weight: 600;
        }
        
        .prova-titulo {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .prova-tipo {
            display: inline-block;
            background: #f0f2f5;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #666;
            margin-right: 8px;
        }
        
        .download-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin-top: 8px;
            transition: all 0.3s ease;
        }
        
        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .input-container {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        
        #userInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        
        #userInput:focus {
            border-color: #667eea;
        }
        
        #sendBtn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        #sendBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        #sendBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .examples {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .example-btn {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .example-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 ConcursAI - Chat Inteligente</h1>
            <p>Pergunte sobre provas e gabaritos de Cebraspe, FCC e FGV (2023-2025)</p>
        </div>
        
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="statTotal">-</div>
                <div class="stat-label">Provas Disponíveis</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statCebraspe">-</div>
                <div class="stat-label">Cebraspe</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statFGV">-</div>
                <div class="stat-label">FGV</div>
            </div>
        </div>
        
        <div class="chat-box">
            <div class="messages" id="messages">
                <div class="message bot">
                    <div class="message-content">
                        👋 Olá! Sou o assistente ConcursAI. Posso te ajudar a encontrar provas e gabaritos!
                        <br><br>
                        <strong>Exemplos de perguntas:</strong>
                        <div class="examples">
                            <button class="example-btn" onclick="enviarExemplo('Mostre provas do Cebraspe 2025')">
                                Provas Cebraspe 2025
                            </button>
                            <button class="example-btn" onclick="enviarExemplo('Quero gabaritos FGV')">
                                Gabaritos FGV
                            </button>
                            <button class="example-btn" onclick="enviarExemplo('Provas de administrador')">
                                Provas Administrador
                            </button>
                            <button class="example-btn" onclick="enviarExemplo('Todas as provas 2024')">
                                Todas 2024
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Pergunte sobre provas, gabaritos, bancas ou anos..." />
                <button id="sendBtn" onclick="enviarPergunta()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        
        // Carrega estatísticas ao iniciar
        window.onload = async function() {
            await carregarEstatisticas();
        };
        
        async function carregarEstatisticas() {
            try {
                const response = await fetch(`${API_URL}/scraping/provas/estatisticas`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('statTotal').textContent = data.data.total_arquivos;
                    document.getElementById('statCebraspe').textContent = 
                        data.data.bancas.cebraspe ? data.data.bancas.cebraspe.total : 0;
                    document.getElementById('statFGV').textContent = 
                        data.data.bancas.fgv ? data.data.bancas.fgv.total : 0;
                }
            } catch (error) {
                console.error('Erro ao carregar estatísticas:', error);
            }
        }
        
        function enviarExemplo(texto) {
            document.getElementById('userInput').value = texto;
            enviarPergunta();
        }
        
        async function enviarPergunta() {
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const pergunta = input.value.trim();
            
            if (!pergunta) return;
            
            // Adiciona mensagem do usuário
            adicionarMensagem(pergunta, 'user');
            input.value = '';
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="loading"></span>';
            
            try {
                const response = await fetch(`${API_URL}/chat/perguntar-provas`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ pergunta: pergunta })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Monta resposta com cards de provas
                    let respostaHTML = `<div>${data.resposta}</div>`;
                    
                    if (data.provas && data.provas.length > 0) {
                        data.provas.forEach(prova => {
                            respostaHTML += `
                                <div class="prova-card">
                                    <div class="prova-header">
                                        <span class="prova-banca">${prova.banca}</span>
                                        <span class="prova-ano">${prova.ano || 'Sem data'}</span>
                                    </div>
                                    <div class="prova-titulo">${prova.titulo}</div>
                                    <span class="prova-tipo">${prova.tipo === 'gabarito' ? '📋 Gabarito' : '📝 Prova'}</span>
                                    <br>
                                    <a href="${prova.url}" target="_blank" class="download-btn">
                                        📥 Baixar PDF
                                    </a>
                                </div>
                            `;
                        });
                    }
                    
                    adicionarMensagem(respostaHTML, 'bot', true);
                } else {
                    adicionarMensagem('Desculpe, ocorreu um erro ao processar sua pergunta.', 'bot');
                }
                
            } catch (error) {
                console.error('Erro:', error);
                adicionarMensagem('Erro ao conectar com o servidor. Verifique se a API está rodando.', 'bot');
            }
            
            sendBtn.disabled = false;
            sendBtn.innerHTML = 'Enviar';
        }
        
        function adicionarMensagem(texto, tipo, isHTML = false) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${tipo}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if (isHTML) {
                contentDiv.innerHTML = texto;
            } else {
                contentDiv.textContent = texto;
            }
            
            messageDiv.appendChild(contentDiv);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        // Enter para enviar
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                enviarPergunta();
            }
        });
    </script>
</body>
</html>
