<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Scraper PCI Últimas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #ffd700;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .scraper-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ff8787);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }
        
        .btn.primary {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
        }
        
        .btn.primary:hover {
            box-shadow: 0 10px 20px rgba(78, 205, 196, 0.3);
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results {
            margin-top: 30px;
        }
        
        .concurso-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #ffd700;
        }
        
        .concurso-titulo {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 10px;
            color: #ffd700;
        }
        
        .concurso-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .info-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.9em;
        }
        
        .fonte-real {
            background: linear-gradient(45deg, #00c851, #007e33);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: 600;
            display: inline-block;
            margin-top: 10px;
        }
        
        .status-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🕷️ Teste Scraper PCI Últimas</h1>
            <p>Teste do scraper atualizado com dados reais do PCI Concursos</p>
        </div>
        
        <div class="card">
            <div class="scraper-controls">
                <button class="btn primary" onclick="executarScraperUltimas()">
                    🌐 Executar Scraper Últimas
                </button>
                <button class="btn" onclick="verificarConectividade()">
                    🔗 Teste Conectividade
                </button>
                <button class="btn" onclick="carregarConcursos()">
                    📋 Ver Concursos Atuais
                </button>
                <a href="http://localhost:8007/docs" class="btn" target="_blank">
                    📖 API Docs
                </a>
            </div>
            
            <div class="status-bar" id="statusBar">
                <strong>Status:</strong> Pronto para executar scraping
            </div>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Coletando dados reais do PCI Concursos...</p>
        </div>
        
        <div class="results" id="results"></div>
    </div>

    <script>
        async function executarScraperUltimas() {
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const statusBar = document.getElementById('statusBar');
            
            loading.style.display = 'block';
            results.innerHTML = '';
            statusBar.innerHTML = '<strong>Status:</strong> Executando scraper do PCI Concursos...';
            
            try {
                const response = await fetch('http://localhost:8007/scraper/executar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.sucesso) {
                    statusBar.innerHTML = `<strong>✅ Sucesso:</strong> ${data.total_coletados} concursos reais coletados do PCI!`;
                    displayResults(data.concursos || []);
                } else {
                    statusBar.innerHTML = `<strong>❌ Erro:</strong> ${data.erro}`;
                    results.innerHTML = '<div class="card"><p>Falha no scraping. Verifique a conectividade.</p></div>';
                }
            } catch (error) {
                statusBar.innerHTML = '<strong>❌ Erro:</strong> Falha na conexão com a API';
                results.innerHTML = '<div class="card"><p>Erro de conexão: ' + error.message + '</p></div>';
            } finally {
                loading.style.display = 'none';
            }
        }
        
        async function verificarConectividade() {
            const statusBar = document.getElementById('statusBar');
            statusBar.innerHTML = '<strong>Status:</strong> Testando conectividade...';
            
            try {
                const response = await fetch('http://localhost:8007/status');
                const data = await response.json();
                statusBar.innerHTML = `<strong>✅ Conectividade:</strong> Sistema funcionando - ${data.total_concursos} concursos carregados`;
            } catch (error) {
                statusBar.innerHTML = '<strong>❌ Conectividade:</strong> Falha na conexão com o sistema';
            }
        }
        
        async function carregarConcursos() {
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const statusBar = document.getElementById('statusBar');
            
            loading.style.display = 'block';
            statusBar.innerHTML = '<strong>Status:</strong> Carregando concursos atuais...';
            
            try {
                const response = await fetch('http://localhost:8007/concursos?limit=10');
                const data = await response.json();
                
                statusBar.innerHTML = `<strong>✅ Carregados:</strong> ${data.length} concursos encontrados`;
                displayResults(data);
            } catch (error) {
                statusBar.innerHTML = '<strong>❌ Erro:</strong> Falha ao carregar concursos';
                results.innerHTML = '<div class="card"><p>Erro: ' + error.message + '</p></div>';
            } finally {
                loading.style.display = 'none';
            }
        }
        
        function displayResults(concursos) {
            const results = document.getElementById('results');
            
            if (!concursos || concursos.length === 0) {
                results.innerHTML = '<div class="card"><p>Nenhum concurso encontrado.</p></div>';
                return;
            }
            
            let html = '<div class="card"><h3>📋 Concursos Coletados</h3></div>';
            
            concursos.forEach(concurso => {
                html += `
                    <div class="concurso-item">
                        <div class="concurso-titulo">${concurso.titulo}</div>
                        <div class="concurso-info">
                            <div class="info-item"><strong>Órgão:</strong> ${concurso.orgao}</div>
                            <div class="info-item"><strong>Local:</strong> ${concurso.local}</div>
                            <div class="info-item"><strong>Região:</strong> ${concurso.regiao}</div>
                            <div class="info-item"><strong>Status:</strong> ${concurso.status}</div>
                            <div class="info-item"><strong>Escolaridade:</strong> ${concurso.escolaridade}</div>
                            <div class="info-item"><strong>Prazo:</strong> ${concurso.prazo_inscricoes}</div>
                        </div>
                        ${concurso.fonte && concurso.fonte.includes('Real') ? 
                            '<span class="fonte-real">🌐 DADOS REAIS PCI</span>' : 
                            '<span style="background: #ffa500; color: white; padding: 5px 15px; border-radius: 15px; font-size: 0.8em;">📋 Dados de exemplo</span>'
                        }
                        ${concurso.url ? `<br><a href="${concurso.url}" target="_blank" style="color: #ffd700; text-decoration: none; margin-top: 10px; display: inline-block;">🔗 Ver no PCI</a>` : ''}
                    </div>
                `;
            });
            
            results.innerHTML = html;
        }
        
        // Carregar concursos ao abrir a página
        window.onload = function() {
            carregarConcursos();
        }
    </script>
</body>
</html>
